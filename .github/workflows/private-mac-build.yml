name: Private macOS Build

on:
  push:
    branches: ['personal/v0.47-weekly-quota-game-fix']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            dist_script: dist:mac
            artifact_name: token-monitor-private-mac-arm64
          - os: macos-15-intel
            arch: x64
            dist_script: dist:mac:x64
            artifact_name: token-monitor-private-mac-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build unsigned private macOS artifacts
        run: npm run ${{ matrix.dist_script }} -- --config.mac.forceCodeSigning=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          TOKEN_MONITOR_WIDGET_ENABLED: '0'
      - name: Upload private macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 7
