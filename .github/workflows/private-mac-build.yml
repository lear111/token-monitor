name: Private macOS Build

on:
  push:
    branches: ['personal/v0.47-weekly-quota-game-fix']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            dist_script: dist:mac
            artifact_name: token-monitor-private-mac-arm64
          - os: macos-15-intel
            arch: x64
            dist_script: dist:mac:x64
            artifact_name: token-monitor-private-mac-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build ad-hoc signed private macOS artifacts
        run: npm run ${{ matrix.dist_script }} -- --config.mac.identity=-
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          TOKEN_MONITOR_WIDGET_ENABLED: '0'
      - name: Verify private macOS installer
        shell: bash
        run: |
          set -euo pipefail
          dmg_path=$(find dist -maxdepth 1 -name "*-${{ matrix.arch }}.dmg" -print -quit)
          if [ -z "$dmg_path" ]; then
            echo "No ${{ matrix.arch }} DMG found" >&2
            exit 1
          fi
          hdiutil verify "$dmg_path"
          mount_dir=$(mktemp -d)
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg_path"
          app_path=$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$app_path" ]; then
            echo "No application bundle found in $dmg_path" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | grep -q 'Signature=adhoc'
      - name: Upload private macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7
